<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0b0e26">
  <title>RCP Study Game</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RCP Study">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Pixelify+Sans:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=storybook1">
  <link rel="stylesheet" href="css/theme-storybook.css?v=storybook1">
</head>
<body>

  <main id="app">
    <!-- Each screen is a <section> with a data-screen id. app.js toggles .active. -->
    <section data-screen="home"           class="screen active"></section>
    <section data-screen="course-mode"    class="screen"></section>
    <section data-screen="boss-select"    class="screen"></section>
    <section data-screen="prep-camp"      class="screen"></section>
    <section data-screen="training"       class="screen"></section>
    <section data-screen="battle"         class="screen"></section>
    <section data-screen="results"        class="screen"></section>
    <section data-screen="scenario-select" class="screen"></section>
    <section data-screen="crisis"         class="screen"></section>
    <section data-screen="outcome"        class="screen"></section>
    <section data-screen="settings"       class="screen"></section>
    <section data-screen="level-up"       class="screen overlay"></section>
    <section data-screen="survival"       class="screen"></section>
    <section data-screen="review-answers" class="screen"></section>
    <section data-screen="superboss-briefing" class="screen"></section>
    <section data-screen="superboss"          class="screen"></section>
  </main>

  <!-- Engine -->
  <script src="js/engine/state.js?v=storybook1"></script>
  <script src="js/engine/audio.js?v=storybook1"     defer></script>
  <script src="js/engine/fx.js?v=storybook1"        defer></script>
  <script src="js/engine/arena-bg.js?v=storybook1"  defer></script>
  <script src="js/engine/battle.js?v=storybook1"    defer></script>
  <script src="js/engine/crisis.js?v=storybook1"    defer></script>
  <script src="js/engine/shop.js?v=storybook1"      defer></script>
  <script src="js/engine/superboss.js?v=storybook1" defer></script>

  <!-- Content (stub initially; replaced by full content later) -->
  <script src="content/stub.js?v=storybook1"             defer></script>
  <script src="content/boss-sprites.js?v=storybook1"     defer></script>
  <script src="content/rcp103-bosses.js?v=storybook1"    defer></script>
  <script src="content/rcp104-bosses.js?v=storybook1"    defer></script>
  <script src="content/rcp103-q-a.js?v=storybook1"       defer></script>
  <script src="content/rcp103-q-b.js?v=storybook1"       defer></script>
  <script src="content/rcp103-q-training.js?v=storybook1"      defer></script>
  <script src="content/rcp103-q-battle-extras.js?v=storybook1" defer></script>
  <script src="content/rcp104-q-a.js?v=storybook1"       defer></script>
  <script src="content/rcp104-q-b.js?v=storybook1"       defer></script>
  <script src="content/rcp104-q-training.js?v=storybook1"      defer></script>
  <script src="content/rcp104-q-battle-extras.js?v=storybook1" defer></script>
  <script src="content/rcp103-scenarios.js?v=storybook1" defer></script>
  <script src="content/rcp104-scenarios.js?v=storybook1" defer></script>
  <script src="content/rcp2xx-superboss.js?v=storybook1" defer></script>
  <script src="content/rcp202-values.js?v=storybook1"    defer></script>
  <script src="content/rcp203-values.js?v=storybook1"    defer></script>

  <!-- App router (loads BEFORE screen files so App.registerScreen exists) -->
  <script src="js/app.js?v=storybook1" defer></script>

  <!-- Screens -->
  <script src="js/screens/home.js?v=storybook1"            defer></script>
  <script src="js/screens/course-mode.js?v=storybook1"     defer></script>
  <script src="js/screens/boss-select.js?v=storybook1"     defer></script>
  <script src="js/screens/prep-camp.js?v=storybook1"       defer></script>
  <script src="js/screens/training.js?v=storybook1"        defer></script>
  <script src="js/screens/battle.js?v=storybook1"          defer></script>
  <script src="js/screens/results.js?v=storybook1"         defer></script>
  <script src="js/screens/scenario-select.js?v=storybook1" defer></script>
  <script src="js/screens/crisis.js?v=storybook1"          defer></script>
  <script src="js/screens/outcome.js?v=storybook1"         defer></script>
  <script src="js/screens/settings.js?v=storybook1"        defer></script>
  <script src="js/screens/level-up.js?v=storybook1"        defer></script>
  <script src="js/screens/survival.js?v=storybook1"        defer></script>
  <script src="js/screens/review-answers.js?v=storybook1"  defer></script>
  <script src="js/screens/superboss-briefing.js?v=storybook1" defer></script>
  <script src="js/screens/superboss.js?v=storybook1"          defer></script>

  <!-- Register service worker for PWA / offline support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
